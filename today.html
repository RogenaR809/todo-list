<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Today's Tasks - TaskFlow</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container-fluid">

    <div class="row">


        

        <div class="col-md-3 col-lg-2 sidebar">

            <a href="dashboard.html" class="logo">
                ✓ TaskFlow
            </a>

            <div class="sidebar-menu">

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="today.html" class="active">
                    Today
                </a>

                <a href="overdue.html">
                    Overdue

                <a href="tasks.html">

                </a>

                <hr class="text-secondary">

                <a href="login.html">
                    Logout
                </a>

            </div>

        </div>


      

        <div class="col-md-9 col-lg-10 main-content">


            <h1 class="page-title">
                Today's Tasks
            </h1>

            <p class="page-subtitle">
                Tasks that need to be completed today.
            </p>


            <div class="mt-4">


               

                <div class="task-card">

                    <div class="d-flex align-items-center">

                        <div class="form-check me-3">

                            <input
                                class="form-check-input"
                                type="checkbox">

                        </div>


                        <div>

                            <div class="task-title">
                                Complete HTML Assignment
                            </div>

                            <div class="task-date">
                                Today - 10:00 AM
                            </div>

                        </div>

                    </div>

                </div>


                

                <div class="task-card">

                    <div class="d-flex align-items-center">

                        <div class="form-check me-3">

                            <input
                                class="form-check-input"
                                type="checkbox">

                        </div>


                        <div>

                            <div class="task-title">
                                Review Bootstrap Components
                            </div>

                            <div class="task-date">
                                Today - 02:00 PM
                            </div>

                        </div>

                    </div>

                </div>


                

                <div class="task-card">

                    <div class="d-flex align-items-center">

                        <div class="form-check me-3">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                checked>

                        </div>


                        <div>

                            <div class="task-title text-decoration-line-through">
                                Read Front-End Notes
                            </div>

                            <div class="task-date">
                                Completed
                            </div>

                        </div>

                    </div>

                </div>


               

                <div class="task-card">

                    <div class="d-flex align-items-center">

                        <div class="form-check me-3">

                            <input
                                class="form-check-input"
                                type="checkbox">

                        </div>


                        <div>

                            <div class="task-title">
                                Practice CSS Flexbox
                            </div>

                            <div class="task-date">
                                Today - 06:00 PM
                            </div>

                        </div>

                    </div>

                </div>


            </div>


        </div>

    </div>

</div>


</body>

</html>
