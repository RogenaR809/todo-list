<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - TaskFlow</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="login-page">


    <div class="auth-card">


        <h1 class="auth-title">
            Create Account
        </h1>


        <p class="auth-subtitle">
            Create your TaskFlow account
        </p>


        <form>


            

            <div class="mb-3">

                <label
                    for="name"
                    class="form-label">

                    Full Name

                </label>


                <input
                    type="text"
                    id="name"
                    class="form-control"
                    placeholder="Enter your full name">

            </div>


            

            <div class="mb-3">

                <label
                    for="registerEmail"
                    class="form-label">

                    Email Address

                </label>


                <input
                    type="email"
                    id="registerEmail"
                    class="form-control"
                    placeholder="Enter your email">

            </div>



            <div class="mb-3">

                <label
                    for="registerPassword"
                    class="form-label">

                    Password

                </label>


                <input
                    type="password"
                    id="registerPassword"
                    class="form-control"
                    placeholder="Create a password">

            </div>


            
            <div class="mb-4">

                <label
                    for="confirmPassword"
                    class="form-label">

                    Confirm Password

                </label>


                <input
                    type="password"
                    id="confirmPassword"
                    class="form-control"
                    placeholder="Confirm your password">

            </div>


           

            <a
                href="dashboard.html"
                class="btn btn-primary w-100">

                Create Account

            </a>


        </form>


      

        <p class="text-center mt-4 mb-0">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


    </div>


</div>


</body>

</html>
